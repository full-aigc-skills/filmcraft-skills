name: Source offline contracts and distribution
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Required offline gates
        run: python3 -I -B scripts/check_release.py --output "${RUNNER_TEMP}/filmcraft-source-checks"
      - name: Preserve per-test results and original logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filmcraft-source-offline
          path: ${{ runner.temp }}/filmcraft-source-checks
          if-no-files-found: error
